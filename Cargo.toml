[package]
name = "fidroh"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ctap-hid-fido2 = "3.6.0"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8"] }
iroh = "1.3.0"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
