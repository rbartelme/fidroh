[package]
name = "fidroh"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rbartelme/fidroh"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctap-hid-fido2 = { version = "3.6.0", optional = true }
dirs = "7.0.0"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8"] }
hex = "0.4.3"
iroh = "1.3.0"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
rpassword = { version = "7.5.4", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = ["hardware"]
# The laptop side: talks to a FIDO2 security key over USB. Servers build without it:
#   cargo build --release --no-default-features
hardware = ["dep:ctap-hid-fido2", "dep:rpassword"]

[[example]]
name = "key_check"
required-features = ["hardware"]